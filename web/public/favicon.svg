<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1512"/>
      <stop offset="100%" stop-color="#0F1C18"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="8%" r="70%">
      <stop offset="0%" stop-color="#123527" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0B1512" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DE8B0"/>
      <stop offset="100%" stop-color="#1FB786"/>
    </linearGradient>
  </defs>

  <!-- App-Icon Hintergrund, abgerundetes Quadrat, passend zum dunklen App-Theme -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Feiner Rahmen wie AppColors.border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#1E362D" stroke-width="1.5"/>

  <!-- Zentrales M-Symbol, Mint-Verlauf wie AppGradients.mint im Login-Logo -->
  <g transform="translate(256,246)">
    <path d="M -96 78
             L -96 -78
             L -50 -78
             L 0 -10
             L 50 -78
             L 96 -78
             L 96 78
             L 58 78
             L 58 -18
             L 12 46
             L -12 46
             L -58 -18
             L -58 78
             Z"
          fill="url(#mint)"/>
  </g>

  <!-- Feiner heller Unterstrich, wie ein Kurs-/Trendstrich -->
  <rect x="196" y="368" width="120" height="6" rx="3" fill="#EAF7F1" opacity="0.85"/>
</svg>
